            type: string
          type: array
          title: Tag
          description: Filter items by tags.
        name: tag
        in: query
      - description: Ordering field. Prefix with '-' for descending order.
        required: false
        schema:
          items:
            type: string
          type: array
          title: Ordering
          description: Ordering field. Prefix with '-' for descending order.
        name: ordering
        in: query
