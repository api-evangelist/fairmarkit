          title: Country
          anyOf:
          - $ref: '#/components/schemas/Country'
          - $ref: '#/components/schemas/EmptyString'
        city:
          title: City
          type: string
          description: Supplier's city.
        zip:
          title: Zip
          type: string
          description: Supplier's zip code.
        phone_number:
          title: Phone Number
          type: string
          description: Supplier's phone number.
        first_name:
          title: First Name
          type: string
          description: Supplier contact's first name.
        last_name:
          title: Last Name
          type: string
          description: Supplier contact's last name.
        address1:
          title: Address1
          type: string
          description: Supplier's first address line.
        address2:
          title: Address2
          type: string
          description: Supplier's second address line.
        state:
          title: State
          type: string
          description: Supplier's state.
        origin:
          allOf:
          - $ref: '#/components/schemas/VendorOrigin'
          default: external
        external_data:
          title: External Data
          type: object
          description: Additional open field to store internal information.
        meta_tags:
          title: Meta Tags
          type: array
          description: Meta tags to store additional information. Send a list of meta tags, and they will be processed. To remove all meta tags, send an empty list.
          items:
            $ref: '#/components/schemas/schemas__base__meta_tag__MetaTagRetrieve'
        erp_systems:
          title: Erp Systems
          type: array
          items:
            $ref: '#/components/schemas/SupplierErpSystem'
          default: []
        created_at:
          type: string
          format: date-time
          title: Created At
          description: Date and time when the Supplier was created.
        updated_at:
          type: string
          format: date-time
          title: Updated At
          description: Date and time when the Supplier was last updated.
    schemas__base__meta_tag__MetaTagRetrieve:
      properties:
        key:
          type: string
          title: Key
        value:
          items:
            type: string
          type: array
          title: Value
      type: object
      required:
      - key
      - value
      title: MetaTagRetrieve
