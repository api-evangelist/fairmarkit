    EmptyString:
      title: EmptyString
      enum:
      - ''
      type: string
      description: Marker used to represent an empty string.
    ListRetrieve_SupplierRetrieve_:
      title: ListRetrieve[SupplierRetrieve]
      required:
      - count
      - results
      description: Paginated list response for suppliers.
      type: object
      properties:
        count:
          title: Count
          type: integer
          description: A count of the number of records in the full results set.
        next:
          title: Next
          type: string
          description: A URL to fetch the next page of results, if more results exist in the set.
        previous:
          title: Previous
          type: string
          description: A URL to fetch the previous page of results, if previous results exist in the set.
        results:
          title: Results
          type: array
          description: A list representing one page of the result set.
          items:
            $ref: '#/components/schemas/SupplierRetrieve'
    SupplierErpSystemRetrieve:
      title: SupplierErpSystemRetrieve
      required:
      - external_supplier_id
      - erp_system_uuid
      - is_active
      type: object
      properties:
        external_supplier_id:
          title: External Supplier Id
          type: string
          description: External Supplier reference ID in the system.
        erp_system_uuid:
          title: Erp System Uuid
          type: string
          format: uuid
          description: ERP system ID (External to Fairmarkit).
        is_active:
          title: External Supplier ID Active Flag
          type: boolean
          description: Active/Inactive status of the External Supplier reference ID.
    VendorOrigin:
      title: VendorOrigin
      enum:
      - internal
      - external
      - public
      type: string
      description: Supplier record origin values.
    Supplier:
      title: Supplier
      required:
      - title
      - email
      type: object
      description: Data about a specific supplier.
      properties:
