      title: RFQRetrieve
      required:
      - uuid
      - title
      - status
      - buyer
      - closes_at
      - external_id
      - items
      - urgency
      - payment_process
      - is_marketplace
      - notes
      - non_lowest_bid_awarding_reason
      - offline_bid_awarding_reason
      - offline_bid_awarding_note
      - awarding_note
