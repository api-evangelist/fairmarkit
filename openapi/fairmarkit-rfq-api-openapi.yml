          title: Sent At
          type: string
          format: date-time
          description: Date and time when the RFQ was sent. String must be formatted using ISO 8601 format.
        opened_at:
          title: Opened At
          type: string
          format: date-time
          description: Date and time when the supplier opened the RFQ. String must be formatted using ISO 8601 format.
        submitted_at:
          title: Submitted At
          type: string
          format: date-time
          description: Date and time when the quote was submitted to the buyer. String must be formatted using ISO 8601 format.
        awarded_at:
          title: Awarded At
          type: string
          format: date-time
          description: Date and time when the quote was awarded by the buyer. String must be formatted using ISO 8601 format.
