          title: Amount Total
          type: number
          description: Total amount.
        awarded_total:
          title: Awarded Total
          type: number
          description: Total amount awarded.
        valid_for:
          title: Valid For
          type: integer
          description: Number of days the quote is valid.
        kind:
          title: Kind
          type: string
          description: RFQ item type. Fairmarkit supports *item* and *service* types.
        notes:
          title: Notes
          type: string
          description: Notes about the quote.
        currency:
          $ref: '#/components/schemas/Currency'
        created_at:
          title: Created At
          type: string
          format: date-time
          description: Date and time when the quote was created. String must be formatted using ISO 8601 format.
        updated_at:
          title: Updated At
          type: string
          format: date-time
          description: Date and time when the quote was last updated. String must be formatted using ISO 8601 format.
        supplier_quote_reference:
          title: Supplier Quote Reference
          type: string
          description: Supplier quote reference number.
        is_offline_bid:
          title: Is Offline Bid
          type: boolean
          description: Was the quote made offline?
