          title: Awarding Total RFX
          type: number
          description: Total RFX amount for awarding.
        meta_tags:
          title: Meta Tags
          type: array
          items:
            $ref: '#/components/schemas/api__v3__models__meta_tag__MetaTagRetrieve'
          default: []
          description: Meta tags to store additional information.
        items:
          title: Items
          type: array
          description: A list of requested items and services.
          items:
            $ref: '#/components/schemas/QuotationItem'
        attachments:
          title: Attachments
          type: array
          description: Attachments added to the supplier response.
          items:
            $ref: '#/components/schemas/AttachmentRetrieve'
