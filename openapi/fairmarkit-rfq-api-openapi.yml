        manufacturer_pn:
          title: Manufacturer Pn
          type: string
          description: Manufacturer part number of the item.
        benchmark_price:
          title: Benchmark Price
          type: number
          description: Benchmark price.
        external_data:
          title: External Data
          type: object
          description: Additional, open field to store internal information about the RFQ event.
        attachments:
          title: Attachments
          type: array
          description: Attachments
          items:
            $ref: '#/components/schemas/AttachmentRetrieve'
        benchmark_external_supplier_id:
          title: Benchmark External Supplier Id
          type: string
          description: External Benchmark Supplier reference ID.
        benchmark_supplier:
          title: Benchmark Supplier
          type: string
          description: External Benchmark Supplier information.
        category:
          title: Category
          description: Category information.
          allOf:
          - $ref: '#/components/schemas/CategoryRetrieve'
          nullable: true
        is_awarded_to_benchmark:
          type: boolean
          title: Is Awarded To Benchmark
    RFQArchiveRequest:
      title: RFQArchiveRequest
      required:
      - archiving_note
      type: object
      properties:
        archiving_note:
          title: Archiving Note
          maxLength: 1000
          minLength: 1
          type: string
    RFQListDetail:
      title: RFQListDetail
      required:
      - id
      - uuid
      - title
      - status
      - created_at
      type: object
      properties:
        id:
          type: string
          title: Id
        uuid:
          title: Uuid
          type: string
          description: RFQ ID (Fairmarkit).
        title:
          title: Title
          type: string
          description: A brief, descriptive title for the request.
        status:
          $ref: '#/components/schemas/CoreRFQStatus'
        external_id:
          title: External Id
          type: string
          default: ''
          description: External RFQ reference ID. It can be used to track RFQs across systems.
        created_at:
          title: Created At
          type: string
          format: date-time
          description: Date and time when the RFQ was created. String must be formatted using ISO 8601 format.
        updated_at:
          title: Updated At
          type: string
          format: date-time
          description: Date and time when the RFQ was last updated. String must be formatted using ISO 8601 format.
        request_id:
          type: string
          title: Request Id
      description: Data returned for a list of request for quote (RFQ) events.
    QuotationItem:
      title: QuotationItem
      required:
      - uuid
      - title
      - kind
      - is_cancelled
      - is_awarded
      - manufacturer
      - manufacturer_pn
      - is_awarding
      - items
      type: object
      description: Data for a specific line item added to a quote.
      properties:
        uuid:
          title: Uuid
          type: string
          description: Quotation Item ID
        title:
          title: Title
          type: string
          description: A brief, descriptive title for the request.
        kind:
          title: Kind
          type: string
          description: RFQ item type. Fairmarkit supports *item* and *service* types.
        is_cancelled:
          title: Is Cancelled
          type: boolean
          description: Is the request for quote canceled?
        is_awarded:
          title: Is Awarded
          type: boolean
          description: Is the request for quote awarded?
        manufacturer:
          title: Manufacturer
          type: string
          description: Manufacturer of the item.
        manufacturer_pn:
          title: Manufacturer Pn
          type: string
          description: Manufacturer part number of the item.
        attachments:
          title: Attachments
          type: array
          description: Attachments added to the line item on the supplier's response.
          items:
            $ref: '#/components/schemas/AttachmentRetrieve'
        rfq_item_uuid:
          title: Rfq Item Uuid
          type: string
          description: RFQ item ID (Fairmarkit).
        delivery_days:
          title: Delivery Days
          type: integer
          description: The number of days it will take to deliver the item.
        quantity:
          title: Quantity
          type: number
          description: Quantity of the item in the selected UOM.
        minimum_order_quantity:
          title: Minimum Order Quantity
          type: integer
          description: The minimum number of a item that is needed.
        unit_price:
          title: Unit Price
          type: number
          description: The USD price per unit (based on UOM).
        unit_price_rfx:
          title: Unit Price RFX
          type: number
          description: The price per unit (based on UOM and original RFX currency).
        uom_percent:
          title: Uom Percent
          type: number
          description: If the selected UOM is a percent value, the quantity of the item in percent.
        uom_number_value:
          title: Uom Number Value
          type: number
          description: If the selected UOM is a number value, the quantity of the item in a number value.
        uom_text_value:
          title: Uom Text Value
          type: string
          description: If the selected UOM is a text value, the amount of the item in a text value.
        uom_yesno_value:
          title: Uom Yesno Value
          type: string
          description: If the selected UOM is a yes/no value, the value for the item.
        uom_date_value:
          title: Uom Date Value
          type: string
          format: date
          description: If the selected UOM is a date value, the date value for the item.
        uom_date_range_start_value:
          title: Uom Date Range Start Value
          type: string
          format: date
          description: The start date in a date range.
        uom_date_range_end_value:
          title: Uom Date Range End Value
          type: string
          format: date
          description: The end date in a date range.
        uom_compliance_value:
          title: Uom Compliance Value
          anyOf:
          - $ref: '#/components/schemas/CompliantUOM'
          - $ref: '#/components/schemas/EmptyString'
          description: Enter if the UOM is compliant. Available selections are *fully_compliant*, *partially_compliant*, or *non-compliant*.
        uom_conversion_rate:
          title: Uom Conversion Rate
          type: string
          description: UOM conversion rate.
        uom_attachment:
          title: Uom Attachment
          type: string
          description: UOM attachment.
        uom:
          title: Uom
          anyOf:
          - $ref: '#/components/schemas/ItemUOM'
          - $ref: '#/components/schemas/ServiceUOM'
          description: Unit of measurement for the item/quantity.
        sku:
          title: Sku
          type: string
          description: Item SKU.
        comments:
          title: Comments
          type: string
          description: Comments about the item.
        country_of_origin:
          title: Country Of Origin
          anyOf:
          - $ref: '#/components/schemas/Country'
          - $ref: '#/components/schemas/EmptyString'
          description: Two-character alphabetic code that represents a country name. Fairmarkit uses the Alpha-2 country codes defined in the ISO 3166 international standard.
        awarded_at:
          title: Awarded At
          type: string
          format: date-time
          description: Date and time when the quote item was awarded by the buyer. String must be formatted using ISO 8601 format.
        awarded_quantity:
          title: Awarded Quantity
          type: number
          description: Awarded quantity of the item in the selected UOM.
        quantity_change_reason_note:
          title: Quantity Change Reason Note
          type: string
        external_supplier_item_id:
          title: External Supplier Item ID
          type: string
          description: 'External Supplier Item ID. '
        meta_tags:
          title: Meta Tags
          type: array
          items:
            $ref: '#/components/schemas/api__v3__models__meta_tag__MetaTagRetrieve'
          default: []
          description: Meta tags to store additional information.
        supplier_pn:
          type: string
          title: Supplier Pn
        is_awarding:
          title: Is Awarding
          type: boolean
          description: Whether the item is currently being awarded.
        awarding_quantity:
          title: Awarding Quantity
          type: number
          description: Quantity being awarded for the item.
        items:
          title: Items
          type: array
          description: A list of requested items and services.
          items:
            $ref: '#/components/schemas/NestedQuotationItem'
    RFQUpdate:
      title: RFQUpdate
      required:
      - title
      - closes_at
      - categories
      type: object
      description: Data for an RFQ update.
      properties:
        title:
          title: Title
          type: string
          description: A brief, descriptive title for the request
        closes_at:
          title: Closes At
          type: string
          format: date-time
          description: Date and time when the RFQ is scheduled to close. String must be formatted using ISO 8601 format. Enter time in 30-minute intervals.
        external_id:
          title: External Id
          type: string
          description: External RFQ reference ID. It can be used to track RFQs across systems.
        urgency:
          allOf:
          - $ref: '#/components/schemas/RFQUrgency'
          default: normal
          description: Urgency of an RFQ request. Available options include *normal*, *rush*, or *emergency*.
        payment_process:
          allOf:
          - $ref: '#/components/schemas/RFQPaymentProcess'
          default: po
          description: How the buyer will pay for goods and services. Available options include *po*, *invoice_only*, or *credit_card*.
        currency:
          allOf:
          - $ref: '#/components/schemas/Currency'
          default: USD
          description: Three-character alphabetic code that represents a currency. Fairmarkit uses the ISO 4217 international standard.
        is_marketplace:
          title: Is Marketplace
          type: boolean
          default: false
          description: Is the RFQ shared to the Fairmarkit marketplace?
        notes:
          title: Notes
          type: string
          description: Notes to suppliers. Up to 4,000 characters can be entered.
        address1:
          title: Address1
          type: string
          description: Address line 1.
        address2:
          title: Address2
          type: string
          description: Address line 2.
        city:
          title: City
          type: string
          description: Address City.
        state:
          title: State
          type: string
          description: Address State.
        zip:
          title: Zip
          type: string
          description: Address Zip Code.
        shipping_type:
          title: Shipping Type
          anyOf:
          - $ref: '#/components/schemas/RFQShippingType'
          - $ref: '#/components/schemas/EmptyString'
          description: Preferred shipping method. Available options include *Courier*, *Critical*, *Freight*, *Ground*, *Ground w/ Freight Pricing*, *Next Day*, *Next Day - AM*, *Ocean Freight*, *Priority Mail*, *Priority Mail Express*, *Same Day*, *Saturday*, *Three Day*, *Two Day*, and *Two Day - Am*. See [Shipping type and Carrier](https://docs.staging.fairmarkit.com/content/glossaries/shippingtype-carrier.htm) for more information.
        carrier:
          title: Carrier
          anyOf:
          - $ref: '#/components/schemas/RFQCarrier'
          - $ref: '#/components/schemas/EmptyString'
          description: Preferred shipping carrier. Available options depend on on the selected Shipping Type. See [Shipping type and Carrier](https://docs.staging.fairmarkit.com/content/glossaries/shippingtype-carrier.htm) for more information.
        country:
          title: Country
          anyOf:
          - $ref: '#/components/schemas/Country'
          - $ref: '#/components/schemas/EmptyString'
        preferred_delivery_date:
          title: Preferred Delivery Date
          type: string
          format: date-time
          description: Preferred delivery date.
        categories:
          title: Categories
          maxItems: 50
          uniqueItems: true
          type: array
          description: Categories.
          items:
            type: string
            format: uuid
        external_data:
          title: External Data
          type: object
          description: Additional, open field to store internal information about the RFQ event.
        meta_tags:
          title: Meta Tags
          description: Meta tags to store additional information. Send a list of meta tags, and they will be processed. To remove all meta tags, send an empty list.
          type: array
          items:
            $ref: '#/components/schemas/api__v3__models__meta_tag__MetaTagRetrieve'
        business_unit:
          title: Business Unit
          type: string
          format: uuid
          description: Business unit UUID (Fairmarkit).
        erp_system_uuid:
          title: Erp System Uuid
          type: string
          format: uuid
          description: ERP system UUID (Fairmarkit).
        requester_title:
          title: Requester Title
          type: string
          description: Requester Title.
        archiving_reason:
          type: string
          title: Archiving Reason
          default: ''
        archiving_note:
          type: string
          title: Archiving Note
          default: ''
        cancellation_reason:
          type: string
          title: Cancellation Reason
          default: ''
    CategoryRetrieve:
      title: CategoryRetrieve
