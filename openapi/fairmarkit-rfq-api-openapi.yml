          title: Non Lowest Bid Awarding Reason
          type: string
          description: Reason the event was not awarded to the lowest response.
        offline_bid_awarding_reason:
          title: Non Lowest Bid Awarding Reason
          type: string
          description: Reason the event was not awarded to the lowest response.
        offline_bid_awarding_note:
          type: string
          title: Offline Bid Awarding Note
        awarding_note:
          title: Awarding Note
