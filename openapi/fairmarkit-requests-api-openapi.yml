    ResponseItemSubmitRequest:
      properties:
        event_item:
          type: string
          format: uuid
          title: Event Item
          description: UUID of the request item for which you provide response data.
          examples:
          - 984c43cb-9195-4d37-bcf8-6e92c8eb1f5f
        is_rejected:
          type: boolean
          title: Is Rejected
          description: Flag should be set to True in case supplier want reject this item.
          default: false
          examples:
          - true
          - false
        quantity:
          anyOf:
          - type: number
          - type: string
          - type: 'null'
          title: Quantity
          description: Item quantity. Could be null in case uncountable item.
          examples:
          - '10'
          - '1.5'
          - '0'
          - null
        uom:
          type: string
          title: Uom
          description: Unit of measurement.
          default: ''
          examples:
          - each
          - bar
          - kilogram
          - ''
        unit_price:
          anyOf:
          - type: number
          - type: string
          - type: 'null'
          title: Unit Price
          description: Item's unit price. Could be null in case unit price is not needed.
          examples:
          - '10'
          - '1.5'
          - '0'
          - null
        delivery_days:
          anyOf:
          - type: integer
          - type: 'null'
          title: Delivery Days
          description: The number of days during which the parcel is planned to be delivered. Could be null.
          examples:
          - 1
          - 5
          - null
        supplier_pn:
          type: string
          title: Supplier Pn
          description: Supplier part number. Could be empty id not exists.
          default: ''
          examples:
          - HDY66-X2
        sku:
          type: string
          title: Sku
          description: Stock Keeping Unit. Could be empty id not exists.
          default: ''
          examples:
          - ZG011AQA
        quantity_change_reason_note:
          type: string
          title: Quantity Change Reason Note
          description: Note for buyer why will be bid not different quantity. Could be empty if not exists.
          default: ''
          examples:
          - There are 12 bottles in the box.
        minimum_order_quantity:
          anyOf:
          - type: number
          - type: string
          - type: 'null'
          title: Minimum Order Quantity
          description: Information for minimum order quantity. Could be null in case not required.
          examples:
          - '10'
          - '1.5'
          - null
        country_of_origin:
          type: string
          title: Country Of Origin
          description: Country of origin. Could be empty.
          default: ''
          examples:
          - US
          - Canada
          - ''
        comments:
          type: string
          title: Comments
          description: Comment for buyer related bid item. Could be empty.
          default: ''
          examples:
          - Hot offer until the end of the week
          - ''
      type: object
      required:
      - event_item
      title: ResponseItemSubmitRequest
