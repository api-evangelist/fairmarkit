        schema:
          type: integer
          maximum: 100
          minimum: 1
          title: Limit
          default: 20
          description: Maximum number of records to return. Defaults to 20.
        name: limit
        in: query
        description: Maximum number of records to return. Defaults to 20.
      - required: false
        schema:
          type: integer
          minimum: 0
          title: Offset
          default: 0
          description: Zero-based offset of the first record to return. Defaults to 0.
        name: offset
        in: query
        description: Zero-based offset of the first record to return. Defaults to 0.
      - description: Start of the created-at time range. Use ISO 8601 format.
        required: false
        schema:
          type: string
          format: date-time
          title: Created At Min
          description: Start of the created-at time range. Use ISO 8601 format.
        name: created_at_min
        in: query
      - description: End of the created-at time range. Use ISO 8601 format.
        required: false
        schema:
          type: string
          format: date-time
          title: Created At Max
          description: End of the created-at time range. Use ISO 8601 format.
        name: created_at_max
        in: query
      - required: false
        schema:
          items:
            $ref: '#/components/schemas/GetListV5OrderingType0Item'
          type: array
          description: Ordering field. Prefix with '-' for descending order.
        name: ordering
        in: query
        description: Ordering field. Prefix with '-' for descending order.
      - required: false
        schema:
          items:
            $ref: '#/components/schemas/RequestStatus'
          type: array
          description: Filter by status.
        name: status
        in: query
        description: Filter by status.
      - required: false
        schema:
          type: string
          title: External Id
        name: external_id
        in: query
      - required: false
        schema:
          type: string
          title: X-Fm-Api-Key
        name: X-FM-API-KEY
        in: header
      responses:
        '200':
          description: Successful Response
          content:
            application/json; charset=utf-8:
