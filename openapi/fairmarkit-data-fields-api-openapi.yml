  /services/self-service/api/v3/data-fields/dataset-items:
    get:
      tags:
      - Data Fields
      summary: List Dataset Items By Filters
      description: Returns dataset items matching the supplied filters.
      operationId: DataFieldApi_get_dataset_items_by_ids_services_self_service_api_v3_data_fields_dataset_items_get
      parameters:
      - description: Filter by dataset item IDs.
        required: true
        schema:
          items:
            type: string
            format: uuid
          type: array
          title: Item Id
          description: Filter by dataset item IDs.
        name: item_id
        in: query
      - required: false
        schema:
          type: integer
          minimum: 0
          title: Offset
          description: Zero-based offset of the first record to return.
        name: offset
        in: query
        description: Zero-based offset of the first record to return.
      - required: false
        schema:
          type: integer
          maximum: 101
          minimum: 0
          title: Limit
          default: 10
          description: Maximum number of records to return. Defaults to 10.
        name: limit
        in: query
        description: Maximum number of records to return. Defaults to 10.
      - required: false
        schema:
          type: string
          title: Search
          description: Search term used to filter results.
        name: search
        in: query
        description: Search term used to filter results.
      - description: Filter items by tags.
        required: false
        schema:
          items:
            type: string
          type: array
          title: Tag
