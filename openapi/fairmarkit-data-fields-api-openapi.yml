components:
  schemas:
    UpdateDatasetItemRequest:
      properties:
        value:
          type: object
          title: Value
          default: {}
        dataset_id:
          type: string
          format: uuid
          title: Dataset Id
        custom_tags:
          type: object
          title: Custom Tags
          default: {}
        external_id:
          type: string
          title: External Id
      type: object
      title: UpdateDatasetItemRequest
    CreateDatasetRequest:
      properties:
        slug:
          type: string
          title: Slug
        title:
          type: string
          title: Title
        schema_id:
          type: string
          format: uuid
          title: Schema Id
      type: object
      required:
      - slug
      - title
      - schema_id
      title: CreateDatasetRequest
    CreateDatasetItemRequest:
      properties:
        value:
          type: object
          title: Value
        custom_tags:
          type: object
          title: Custom Tags
          default: {}
        external_id:
          type: string
          title: External Id
      type: object
      required:
      - value
      title: CreateDatasetItemRequest
    HTTPValidationError:
      title: HTTPValidationError
      type: object
      description: Validation error response.
      properties:
        detail:
          title: Detail
          type: array
          description: Details about a specific error to display in error response.
          items:
            $ref: '#/components/schemas/ValidationError'
    ValidationError:
      title: ValidationError
      required:
      - loc
      - msg
      - type
      type: object
      description: Details for a validation error.
      properties:
        loc:
          title: Location
          type: array
          description: Error location
          items:
            anyOf:
            - type: string
            - type: integer
        msg:
          title: Message
          type: string
          description: Human readable explanation of the error.
        type:
          title: Error Type
          type: string
          description: Computer-readable identifier of the error type.
    DataFieldDatasetSlugResponse:
      properties:
        slug:
          type: string
          title: Slug
      type: object
      required:
      - slug
      title: DataFieldDatasetSlugResponse
    DataFieldDatasetItemIDResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
      type: object
      required:
      - id
      title: DataFieldDatasetItemIDResponse
    DataFieldDatasetItemResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        created_at:
          type: string
          format: date-time
          title: Created At
        created_by:
          type: string
          format: uuid
          title: Created By
        dataset_id:
          type: string
          format: uuid
          title: Dataset Id
        value:
          type: object
          title: Value
        custom_tags:
          type: object
          title: Custom Tags
        external_id:
          type: string
          title: External Id
        updated_at:
          type: string
          format: date-time
          title: Updated At
        updated_by:
          type: string
          format: uuid
          title: Updated By
      type: object
      required:
      - id
      - created_at
      - created_by
      - dataset_id
      - value
      title: DataFieldDatasetItemResponse
    DataFieldDatasetResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        created_at:
          type: string
          format: date-time
          title: Created At
        created_by:
          type: string
          format: uuid
          title: Created By
        tenant_id:
          type: string
          format: uuid
          title: Tenant Id
        slug:
          type: string
          title: Slug
        title:
          type: string
          title: Title
        schema_id:
          type: string
          format: uuid
          title: Schema Id
        active:
          type: boolean
          title: Active
        updated_at:
          type: string
          format: date-time
          title: Updated At
        updated_by:
          type: string
          format: uuid
          title: Updated By
      type: object
      required:
      - id
      - created_at
      - created_by
      - tenant_id
      - slug
      - title
      - schema_id
      - active
      title: DataFieldDatasetResponse
    UploadDatasetItemsRequest:
      properties:
        dataset_slug:
          type: string
          title: Dataset Slug
        file_id:
          type: string
          format: uuid
          title: File Id
      type: object
      required:
      - dataset_slug
      - file_id
      title: UploadDatasetItemsRequest
    UpdateDatasetRequest:
      properties:
        title:
          type: string
          maxLength: 255
          title: Title
        active:
          type: boolean
          title: Active
        slug:
          type: string
          maxLength: 50
          title: Slug
      type: object
      title: UpdateDatasetRequest
