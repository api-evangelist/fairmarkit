              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Data Fields
      summary: Delete Dataset
      description: Deletes a dataset.
      operationId: DataFieldApi_delete_dataset_services_self_service_api_v3_data_fields_dataset__slug__delete
      parameters:
      - required: true
        schema:
          type: string
          title: Slug
        name: slug
        in: path
      - required: false
        schema:
          type: string
          title: X-Fm-Api-Key
