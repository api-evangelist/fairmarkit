          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/DataFieldDatasetSlugResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Data Fields
      summary: Get Dataset Details
      description: Returns details for a dataset.
      operationId: DataFieldApi_get_dataset_by_slug_services_self_service_api_v3_data_fields_dataset__slug__get
      parameters:
      - required: true
        schema:
