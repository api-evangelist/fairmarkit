aid: fairmarkit
name: Fairmarkit
description: >-
  Fairmarkit is an autonomous sourcing and strategic procurement platform that uses AI
  agents to automate the full sourcing lifecycle — from intake and request creation
  through RFQ/RFP/RFI events, supplier bidding, award, and purchase-order handoff to ERP
  and P2P systems. Fairmarkit publishes a public, OpenAPI 3.1-described Buyer Self-Service
  REST API (v3 and v4) and a Supplier Public API, secured with an X-FM-API-KEY header,
  covering RFQ/RFP events, requests and request items, suppliers, purchase orders,
  price books, datasets/data fields, business units, categories, identities, permission
  sets, data exports, and file attachments, plus a rich webhook notification catalog for
  procurement events. The company is backed by GGV Capital and Insight Partners.
